name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      # Archives stay as Git LFS pointer stubs here (lfs: false): CI never downloads the multi-hundred-MB
      # FIRMS archives. The tracked Parquet summaries are enough for the API / science tests, and the
      # pointer stubs exercise the LFS-detection path.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Archives are pointer stubs, never parsed as ZIPs
        run: |
          for z in DL_FIRE_*.zip; do head -c 40 "$z" | grep -q "git-lfs" && echo "$z: LFS pointer"; done
      - name: Pipeline CLI (dry run, unknown args rejected)
        working-directory: backend
        run: |
          python -m app.pipeline --dry-run --only-new
          if python -m app.pipeline --definitely-not-an-option; then exit 1; fi
      - name: Unit, integration and science tests
        working-directory: backend
        run: python -m pytest tests -q

  backend-security:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off

  frontend:
    name: Frontend build, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser end-to-end journeys (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run journeys (real API on a throw-away DB copy)
        working-directory: frontend
        env:
          PYROSCOPE_E2E_PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

  docker:
    name: Docker images build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Prepare runtime config (no secrets; defaults only)
        run: |
          cp .env.example .env
          chmod -R a+rwX data          # container runs as uid 10001; the bind-mounted data dir must be writable
      - name: Build and start (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<div id=\"root\"" && echo "UI served"
          curl -fsS http://127.0.0.1:8080/api/health | tee /tmp/health.json
          python3 -c "import json,sys; h=json.load(open('/tmp/health.json')); sys.exit(0 if h['database']['ok'] else 1)"
          curl -fsS http://127.0.0.1:8080/api/orbits/status > /dev/null && echo "orbits ok"
          curl -fsS http://127.0.0.1:8080/api/exposure/layers > /dev/null && echo "exposure ok"
      - name: Images carry no credentials
        run: |
          for img in $(docker compose images -q); do
            if docker image inspect "$img" --format '{{json .Config.Env}}' | grep -Ei 'PASSWORD|TOKEN|SECRET|API_KEY'; then exit 1; fi
          done
          echo "no credential-like variables baked into images"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Stop
        if: always()
        run: docker compose down -v
