name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      # Archives stay as Git LFS pointer stubs here (lfs: false): CI never downloads the multi-hundred-MB
      # FIRMS archives. The tracked Parquet summaries are enough for the API / science tests, and the
      # pointer stubs exercise the LFS-detection path.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Archives are pointer stubs, never parsed as ZIPs
        run: |
          for z in DL_FIRE_*.zip; do head -c 40 "$z" | grep -q "git-lfs" && echo "$z: LFS pointer"; done
      - name: Pipeline CLI (dry run, unknown args rejected)
        working-directory: backend
        run: |
          python -m app.pipeline --dry-run --only-new
          if python -m app.pipeline --definitely-not-an-option; then exit 1; fi
      - name: Production configuration validation (test-only values, never real secrets)
        working-directory: backend
        run: |
          PYROSCOPE_AUTH_MODE=production PYROSCOPE_CORS_ORIGINS=https://pyroscope.example.org \
            PYROSCOPE_ADMIN_PASSWORD=CI-only-Test-Passw0rd python -m app.system_config > /dev/null
          if PYROSCOPE_AUTH_MODE=production PYROSCOPE_CORS_ORIGINS='*' python -m app.system_config > /dev/null; then
            echo "wildcard CORS / missing admin must be rejected in production"; exit 1; fi
      - name: Unit, integration and science tests
        working-directory: backend
        run: python -m pytest tests -q

  backend-security:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off

  frontend:
    name: Frontend build, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (all dependencies, moderate and above)
        run: npm audit --audit-level=moderate

  postgres:
    name: PostgreSQL / Supabase migrations, RLS, data copy and job claims
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: pyroscope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Committed Supabase SQL matches the models
        working-directory: backend
        run: |
          python -m app.pg_migrate schema-sql
          git diff --exit-code ../supabase/migrations
      - name: Migrations, RLS (anon denied), SQLite -> PostgreSQL copy with reconciliation, atomic job claims
        working-directory: backend
        env:
          PYROSCOPE_TEST_PG_URL: postgresql://postgres:ci-only-disposable@127.0.0.1:5432/pyroscope_test
        run: python -m pytest tests/test_ultimate.py -q -k "postgres or supabase"

  vercel-build:
    name: Vercel-style frontend build (external API origin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build exactly as Vercel does (vercel.json buildCommand / outputDirectory)
        env:
          VITE_API_BASE_URL: https://api.pyroscope.example.org
        run: |
          node -e "const v=require('./vercel.json'); if(v.framework!=='vite'||v.outputDirectory!=='dist') process.exit(1)"
          npm run build
          test -f dist/index.html
          grep -rq "https://api.pyroscope.example.org" dist/assets && echo "API origin baked in from VITE_API_BASE_URL"
          if grep -rEi "service_role|SUPABASE_SERVICE|EARTHDATA_TOKEN" dist; then echo "secret-like value in the bundle"; exit 1; fi

  e2e:
    name: Browser end-to-end journeys (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run journeys (dev + production stacks, real API on throw-away DB copies)
        working-directory: frontend
        env:
          PYROSCOPE_E2E_PYTHON: python
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/test-results/
            frontend/e2e-screens/
            frontend/playwright-report/
          retention-days: 14

  docker:
    name: Docker images build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Prepare runtime config (no secrets; defaults only)
        run: |
          cp .env.example .env
          chmod -R a+rwX data          # container runs as uid 10001; the bind-mounted data dir must be writable
      - name: Build and start (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -qi "<div id=\"root\"" && echo "UI served"
          curl -fsS http://127.0.0.1:8080/api/health | tee /tmp/health.json
          python3 -c "import json,sys; h=json.load(open('/tmp/health.json')); sys.exit(0 if h['database']['ok'] else 1)"
          curl -fsS http://127.0.0.1:8080/api/orbits/status > /dev/null && echo "orbits ok"
          curl -fsS http://127.0.0.1:8080/api/exposure/layers > /dev/null && echo "exposure ok"
          # The committed processed dataset must be READY (a reachable DB alone is not enough) and the calendar must serve it.
          curl -fsS http://127.0.0.1:8080/api/data/readiness | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['status'], r['satellites']); sys.exit(0 if r['status']=='READY' else 1)"
          curl -fsS "http://127.0.0.1:8080/api/calendar?region=country&year=2024" | python3 -c "import json,sys; c=json.load(sys.stdin); assert len(c['days'])==366; print('calendar ok')"
          docker compose ps worker --format '{{.State}}' | grep -q running && echo "worker running"
      - name: Image-only boot (Render-like, no bind mount) installs the bundled dataset into an empty data dir
        run: |
          docker build -t pyroscope-api-seedtest .
          docker run -d --name seedtest -p 8090:8000 -e PYROSCOPE_DATA_DIR=/tmp/pyroscope-data pyroscope-api-seedtest
          for i in $(seq 1 60); do
            s=$(curl -fsS http://127.0.0.1:8090/api/data/readiness 2>/dev/null | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['status'], r['seed']['state'])" || true)
            echo "$s"; case "$s" in READY*) break;; esac; sleep 5
          done
          curl -fsS http://127.0.0.1:8090/api/data/readiness | python3 -c "import json,sys; r=json.load(sys.stdin); sys.exit(0 if r['status']=='READY' and r['seed']['state']=='installed' else 1)"
          curl -fsS "http://127.0.0.1:8090/api/calendar?region=country&year=2024" > /dev/null && echo "calendar served from the installed seed"
          docker restart seedtest
          for i in $(seq 1 24); do curl -fsS http://127.0.0.1:8090/api/data/readiness 2>/dev/null | grep -q '"state":"skipped"' && break; sleep 5; done
          curl -fsS http://127.0.0.1:8090/api/data/readiness | python3 -c "import json,sys; r=json.load(sys.stdin); print(r['seed']); sys.exit(0 if r['status']=='READY' and r['seed']['state']=='skipped' else 1)"
          docker logs seedtest 2>&1 | grep "\[seed\]"
          docker rm -f seedtest
      - name: Images carry no credentials
        run: |
          for img in $(docker compose images -q); do
            if docker image inspect "$img" --format '{{json .Config.Env}}' | grep -Ei 'PASSWORD|TOKEN|SECRET|API_KEY'; then exit 1; fi
          done
          echo "no credential-like variables baked into images"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Stop
        if: always()
        run: docker compose down -v
