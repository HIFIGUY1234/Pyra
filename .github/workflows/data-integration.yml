name: Data integration (manual)

# Pulls the real FIRMS archives from Git LFS and validates them end to end. Run manually:
# it transfers several hundred MB of LFS bandwidth. No NASA keys are needed for this job;
# if a FIRMS refresh is added later, use the FIRMS_MAP_KEY repository secret, never a literal.
on:
  workflow_dispatch:
    inputs:
      full_pipeline:
        description: "Also rebuild summaries and the scientific report (no ingest of new sources)"
        type: boolean
        default: false
      linear_gis:
        description: "Download the Geofabrik India extract and build linear infrastructure layers (artifact)"
        type: boolean
        default: false
      population:
        description: "Download WorldPop 2020 and rebuild area-weighted population layers (artifact)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Archive integrity, hold-out and seam (read-only)
        working-directory: backend
        run: python -m app.pipeline --validate-only | tee validation.json
      - name: Fail on any non-valid archive
        working-directory: backend
        run: python -c "import json,sys; d=json.load(open('validation.json')); sys.exit(1 if d['archive_problems'] else 0)"
      - name: Rebuild downstream products
        if: ${{ inputs.full_pipeline }}
        working-directory: backend
        run: python -m app.pipeline --only-new --skip-weather --skip-train
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.full_pipeline }}
        with:
          name: scientific-report
          path: |
            docs/SCIENTIFIC_VALIDATION.md
            data/processed/ingestion_report.md

  linear-gis:
    if: ${{ inputs.linear_gis }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Download (MD5-verified) and process the Geofabrik India extract
        working-directory: backend
        run: |
          python -m app.linear_gis fetch
          python -m app.linear_gis build
          rm -f ../data/auxiliary/linear/*.pbf ../data/auxiliary/linear/nodes.idx
      - uses: actions/upload-artifact@v4
        with:
          name: linear-gis-layers
          path: data/auxiliary/linear/
          retention-days: 30

  population:
    if: ${{ inputs.population }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt
      - name: Download WorldPop 2020 and rebuild area-weighted layers (with pixel-centre sensitivity)
        working-directory: backend
        run: python -c "from app import population; print(population.build(population.acquire(), method='area_weighted')['sensitivity_vs_pixel_centre'])"
      - uses: actions/upload-artifact@v4
        with:
          name: population-area-weighted
          path: |
            data/auxiliary/population/manifest.json
            data/auxiliary/population/population_cells.parquet
            data/auxiliary/population/population_fine.parquet
            data/auxiliary/exposure/population.parquet
            data/auxiliary/exposure/population.json
          retention-days: 30
